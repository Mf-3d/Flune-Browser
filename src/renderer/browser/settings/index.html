<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="icon"
      href="/image/icon.png"
    />
    <link
      rel="stylesheet"
      href="/style/main.css"
    />
    <link
      rel="stylesheet"
      href="/style/browser.css"
    />
    <link
      rel="stylesheet"
      href="/style/settings.css"
    />
    <title>設定 - Flune-Browser</title>
  </head>

  <body>
    <span style="user-select: none">
      <h1 style="display: inline-block; user-select: none">Flune-Browser</h1>
      <span class="flune-version">3</span>
    </span>

    <section class="typeA">
      <input
        id="TAB-A01"
        type="radio"
        name="TAB-A"
        checked="checked"
      />
      <label
        class="tabLabel"
        for="TAB-A01"
        >見た目</label
      >
      <div class="content">
        <table>
          <tr>
            <th>テーマ</th>
            <td>
              <form id="theme-select">
                <!--
              <input type="radio" id="theme-dark" name="theme" />
              <label for="theme-dark">Dark</label>
              <input type="radio" id="theme-light" name="theme" />
              <label for="theme-light">Light</label>
              -->
                <br />
              </form>
            </td>
          </tr>
          <tr>
            <th><label for="toggle-home-button">ホームボタンを表示する</label></th>
            <td>
              <input
                type="checkbox"
                name="toggle-home-button"
                id="toggle-home-button"
              />
            </td>
          </tr>
        </table>
      </div>
      <input
        id="TAB-A02"
        type="radio"
        name="TAB-A"
      />
      <label
        class="tabLabel"
        for="TAB-A02"
        >動作</label
      >
      <div class="content">
        <table>
          <tr>
            <th>検索エンジン</th>
            <td>
              <select id="search-engine">
                <!-- 
              <option value="search-engine">
                Search Engine
              </option>
              --></select>
            </td>
          </tr>
          <tr>
            <th><label for="setting-auto-save">設定を自動保存する</label></th>
            <td>
              <input
                type="checkbox"
                name="setting-auto-save"
                id="setting-auto-save"
              />
            </td>
          </tr>
        </table>
      </div>
      <input
        id="TAB-A03"
        type="radio"
        name="TAB-A"
      />
      <label
        class="tabLabel"
        for="TAB-A03"
        >実験的な機能</label
      >
      <div class="content">
        <h2>注意</h2>
        <p>
          ここにある設定項目は実験的な機能であり、
          <br />
          <span class="text-red">一般利用には適していない</span>ことにご注意ください。
        </p>
        <table>
          <tr>
            <th>
              <label for="force-twemoji">強制的にTwimojiを変換する</label>
            </th>
            <td>
              <input
                type="checkbox"
                id="force-twemoji"
                disabled
              />
            </td>
          </tr>
        </table>
      </div>
    </section>

    <a
      id="save-button"
      class="save-button"
      >保存</a
    >

    <script
      type="module"
      src="./index.ts"
    ></script>
    <script
      type="module"
      src="../index.ts"
    ></script>
  </body>
</html>
