<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="icon"
      href="/image/icon.png"
    />
    <link
      rel="stylesheet"
      href="/style/main.css"
    />
    <link
      rel="stylesheet"
      href="/style/browser.css"
    />
    <title>バージョン情報 - Flune-Browser</title>
    <style>
      .undefined {
        font-family: system-ui;
        font-weight: bolder;
        color: color-mix(in srgb, var(--text-color), var(--disabled-color) 80%);
      }

      div {
        justify-content: center;
        margin-bottom: 2em;
      }

      div > * {
        margin: 0 auto;
      }
    </style>
  </head>

  <body style="text-align: center">
    <div style="background-image: var(--background-image)">
      <span style="user-select: none">
        <h1 style="display: inline-block; user-select: none">Flune-Browser</h1>
      </span>
      <p>
        <a
          href="https://mf-3d.github.io/project/flune-browser"
          target="_blank"
          rel="noopener noreferrer"
          >Website</a
        >
        &nbsp;
        <a
          href="https://github.com/mf-3d/flune-browser"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub</a
        >
      </p>
    </div>
    <div>
      <table>
        <tr>
          <th scope="row">Flune-Browser</th>
          <td><span class="version-flune undefined">undefined</span></td>
        </tr>
        <tr>
          <th scope="row">Electron</th>
          <td><span class="version-electron undefined">undefined</span></td>
        </tr>
        <tr>
          <th scope="row">Node.js</th>
          <td><span class="version-node undefined">undefined</span></td>
        </tr>
        <tr>
          <th scope="row">Google Chrome</th>
          <td><span class="version-chrome undefined">undefined</span></td>
        </tr>
        <tr>
          <th scope="row">V8</th>
          <td><span class="version-v8 undefined">undefined</span></td>
        </tr>
      </table>
    </div>

    <script
      type="module"
      src="./index.ts"
    ></script>
    <script
      type="module"
      src="../index.ts"
    ></script>
  </body>
</html>
